# Validate and deploy the curated public site to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh resource versions
        run: python3 scripts/version-assets.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check interaction regressions
        run: node --test tests/*.test.cjs

      - name: Check resource version generation
        run: python3 tests/resource_versions_test.py

      - name: Check HTML integrity
        run: python3 tests/html-integrity.py

      - name: Set up Notes build checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare Notes image checks
        run: python3 -m pip install --disable-pip-version-check -r scripts/notes/requirements.txt

      - name: Check Notes publication and privacy
        run: python3 tests/notes_test.py

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh resource versions
        run: python3 scripts/version-assets.py
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "public"
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
