name: Preview a note privately
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Pages CMS preview request'
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Read private content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: content
          persist-credentials: false
      - name: Read website templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TGthms/about
          path: website
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare image processing
        run: python -m pip install --disable-pip-version-check -r website/scripts/notes/requirements.txt
      - name: Build a self-contained preview
        working-directory: website
        env:
          PREVIEW_PAYLOAD: ${{ inputs.payload }}
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          private = Path('../content').resolve()
          request = json.loads(os.environ['PREVIEW_PAYLOAD'])
          path = (private / request['context']['path']).resolve()
          if not path.is_relative_to(private / 'notes') or path.suffix != '.json':
              raise SystemExit('Choose a note from the Notes collection.')
          spec = importlib.util.spec_from_file_location('notes', 'scripts/notes/build.py')
          notes = importlib.util.module_from_spec(spec); spec.loader.exec_module(notes)
          notes.build(private, Path('public').resolve(), path, Path('../preview').resolve())
          PY
      - name: Save private preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: note-preview
          path: preview/*.html
          retention-days: 3
      - name: Explain the preview
        run: |
          echo 'Download **note-preview** below and open the HTML file in your browser. It contains the page and its media, so you can resize it to check phone and desktop layouts. This artifact is only accessible through this private repository.' >> "$GITHUB_STEP_SUMMARY"
