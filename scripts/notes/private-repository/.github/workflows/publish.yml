name: Publish notes
on:
  push:
    branches: [main]
    paths: ['notes/**', 'media/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notes-publication
  cancel-in-progress: false
jobs:
  publish:
    if: vars.NOTES_PUBLICATION_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Read private content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: content
          persist-credentials: false
      - name: Read public website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TGthms/about
          ref: main
          path: website
          ssh-key: ${{ secrets.NOTES_PUBLISH_KEY }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare image processing
        run: python -m pip install --disable-pip-version-check -r website/scripts/notes/requirements.txt
      - name: Export, validate, and publish notes
        working-directory: website
        run: bash scripts/notes/publish.sh
