name: Publish notes
on:
  push:
    branches: [main]
    paths: ['notes/**', 'media/**', '.github/workflows/publish.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notes-publication
  cancel-in-progress: false
jobs:
  publish:
    if: vars.NOTES_PUBLICATION_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check scheduled expiry
        id: expiry
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import datetime as dt, json, os, urllib.request
          publish = True
          if os.environ['EVENT_NAME'] == 'schedule':
              request = urllib.request.Request('https://raw.githubusercontent.com/TGthms/about/main/public/notes-expiry.json', headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  deadlines = json.load(response)
              now = dt.datetime.now(dt.timezone.utc)
              publish = any(dt.datetime.fromisoformat(end.replace('Z', '+00:00')) <= now for end in deadlines)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(publish).lower() + '\n')
          PYCODE
      - name: Read private content
        if: steps.expiry.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: content
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read public website
        if: steps.expiry.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TGthms/about
          ref: main
          path: website
          ssh-key: ${{ secrets.NOTES_PUBLISH_KEY }}
      - name: Set up Python
        if: steps.expiry.outputs.publish == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare image processing
        if: steps.expiry.outputs.publish == 'true'
        run: python -m pip install --disable-pip-version-check -r website/scripts/notes/requirements.txt
      - name: Export, validate, and publish notes
        if: steps.expiry.outputs.publish == 'true'
        working-directory: website
        run: bash scripts/notes/publish.sh
